name: Benchmark

# The full 114-sample corpus, including the pinned public repositories.
#
# This is the run that catches false positives on real projects: 0.7.0 shipped
# verdicts of HIGH (unsafe to clone) on evanw/esbuild and MEDIUM on
# reduxjs/redux, and nothing noticed, because ci.yml runs only the unit tests
# and the canonical snapshot it could have been compared against was a month
# old. It needs a GitHub token, so it cannot run on pull requests from forks
# and lives here rather than in ci.yml.
#
# Nightly matters beyond catching code regressions: detection rules ship from
# flagrix-detection-rules on their own cadence and reach the scanner without a
# commit here, so a rule can introduce a false positive that no PR touches.
on:
  schedule:
    # 04:20 UTC — after the detection-rules day, before Europe is awake.
    - cron: "20 4 * * *"
  workflow_dispatch:
    inputs:
      corpus:
        description: "Limit to one corpus (blank = all)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci

      - name: Selection fingerprint
        id: fp
        run: echo "value=$(python3 benchmark/offline/mirror.py --fingerprint)" >> "$GITHUB_OUTPUT"

      # The mirror holds every blob the scanner could select, so the corpus
      # runs with no GitHub API at all. That is the point: a full API-backed
      # run costs roughly a whole hourly quota, and the limit is per user
      # rather than per token, so the nightly, a release and anyone running it
      # locally used to starve each other. The v0.6.1 release died that way.
      - name: Restore the offline mirror
        uses: actions/cache@v4
        with:
          path: benchmark/offline/git
          key: mirror-${{ hashFiles('benchmark/corpus.lock.json') }}-${{ steps.fp.outputs.value }}

      # A no-op when the cache hit; fetches over git, never the API, when not.
      - name: Build the offline mirror
        run: python3 benchmark/offline/mirror.py

      - name: Full corpus (offline)
        run: |
          if [ -n "${{ inputs.corpus }}" ]; then
            node --import ./benchmark/offline/gitmock.mjs benchmark/run.mjs --corpus "${{ inputs.corpus }}" --enforce-gates
          else
            node --import ./benchmark/offline/gitmock.mjs benchmark/run.mjs --enforce-gates
          fi

      # The run itself, so a failure can be read without reproducing it. Only
      # the ad-hoc outputs; the canonical snapshots are committed in the repo.
      - name: Upload the run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ github.run_id }}
          path: |
            benchmark/results/latest.json
            benchmark/results/latest.csv
          if-no-files-found: warn
          retention-days: 30

      # The same corpus read as one archive per commit, which is what
      # `--tarball` does: 70,253 files against 9,581, and on 2026-11-20 ten
      # verdicts off "low" and two red gates, which is why that reader is
      # opt-in. Not blocking, because it is a measurement of something the CLI
      # does not do by default — it is here to say when it could, and the
      # answer moves with the detection rules rather than with this repo.
      - name: Full corpus as snapshots (not blocking)
        if: ${{ !inputs.corpus }}
        continue-on-error: true
        run: node --import ./benchmark/offline/gitmock.mjs benchmark/run.mjs --tarball --enforce-gates

      - name: Upload the snapshot run
        if: ${{ always() && !inputs.corpus }}
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-tarball-${{ github.run_id }}
          path: |
            benchmark/results/latest.json
            benchmark/results/latest.csv
          if-no-files-found: warn
          retention-days: 30
