name: Release

# Publishes to npm on version tags (v0.1.0, …). Uses npm trusted publishing
# (OIDC) — configure it on npmjs.com after the first manual publish, then no
# token secret is needed.
#
# Then publishes server.json to the MCP Registry (io.github.flagrix-io/flagrix),
# also over OIDC. The registry only stores metadata pointing at the npm
# package, so it must run after npm serves the version (hence the wait). If
# the registry step still fails, re-run it on its own with the "MCP Registry"
# workflow (mcp-registry.yml) rather than re-running this one, whose npm
# publish would fail on the existing version.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # npm provenance / trusted publishing, MCP Registry login

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      # Pinned on purpose; bump deliberately. Don't switch to releases/latest.
      MCP_PUBLISHER_VERSION: v1.8.4
    steps:
      - uses: actions/checkout@v4

      # A tag that disagrees with package.json or server.json would publish
      # one version to npm and advertise another in the registry.
      - name: Check versions match the tag
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(jq -r .version package.json)"
          srv="$(jq -r .version server.json)"
          srv_pkg="$(jq -r '.packages[0].version' server.json)"
          echo "tag=$tag package.json=$pkg server.json=$srv server.json packages[0]=$srv_pkg"
          if [ "$tag" != "$pkg" ] || [ "$tag" != "$srv" ] || [ "$tag" != "$srv_pkg" ]; then
            echo "::error::Version mismatch: bump package.json and both versions in server.json to $tag"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run typecheck && npm test && npm run build

      # The last gate before the registry. 0.7.0 of the engine published
      # verdicts of HIGH (unsafe to clone) on evanw/esbuild and MEDIUM on
      # reduxjs/redux; the unit tests above were all green, because a false
      # positive on a real repository only shows in this corpus.
      - name: Selection fingerprint
        id: fp
        run: echo "value=$(python3 benchmark/offline/mirror.py --fingerprint)" >> "$GITHUB_OUTPUT"

      # The mirror holds every blob the scanner could select, so the corpus
      # runs with no GitHub API at all. That is the point: a full API-backed
      # run costs roughly a whole hourly quota, and the limit is per user
      # rather than per token, so the nightly, a release and anyone running it
      # locally used to starve each other. The v0.6.1 release died that way.
      - name: Restore the offline mirror
        uses: actions/cache@v4
        with:
          path: benchmark/offline/git
          key: mirror-${{ hashFiles('benchmark/corpus.lock.json') }}-${{ steps.fp.outputs.value }}

      # A no-op when the cache hit; fetches over git, never the API, when not.
      - name: Build the offline mirror
        run: python3 benchmark/offline/mirror.py

      # The reader the CLI ships: one archive per commit, which gitmock builds
      # from the mirror's blobs.
      - name: Benchmark gate (full corpus, offline)
        run: node --import ./benchmark/offline/gitmock.mjs benchmark/run.mjs --enforce-gates

      # `--no-tarball` still reads file by file, so it is gated too for as long
      # as the CLI supports it. Runs after a red snapshot gate as well, so the
      # uploaded run shows both readers; publish still needs both green.
      - name: Benchmark gate, per-file reader (full corpus, offline)
        if: ${{ !cancelled() }}
        run: node --import ./benchmark/offline/gitmock.mjs benchmark/run.mjs --no-tarball --enforce-gates

      - name: Upload the benchmark run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-release-${{ github.ref_name }}
          path: |
            benchmark/results/latest-tarball.json
            benchmark/results/latest-tarball.csv
            benchmark/results/latest-per-file.json
            benchmark/results/latest-per-file.csv
          if-no-files-found: warn
          retention-days: 90

      - run: npm publish --provenance --access public

      # The registry validates the npm version, which npm may not serve yet.
      - name: Wait for npm to serve the new version
        run: scripts/wait-for-npm.sh "$(jq -r .name package.json)" "${GITHUB_REF_NAME#v}"

      # ── MCP Registry ────────────────────────────────────────────────────
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"

          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Log in to the MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json to the MCP Registry
        run: ./mcp-publisher publish
