name: Release

# Publishes to npm on version tags (v0.1.0, …). Uses npm trusted publishing
# (OIDC) — configure it on npmjs.com after the first manual publish, then no
# token secret is needed.
#
# Then publishes server.json to the MCP Registry (io.github.flagrix-io/flagrix),
# also over OIDC. The registry only stores metadata pointing at the npm
# package, so it must run after npm has the version.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # npm provenance / trusted publishing, MCP Registry login

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      # Pinned on purpose; bump deliberately. Don't switch to releases/latest.
      MCP_PUBLISHER_VERSION: v1.8.4
    steps:
      - uses: actions/checkout@v4

      # A tag that disagrees with package.json or server.json would publish
      # one version to npm and advertise another in the registry.
      - name: Check versions match the tag
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(jq -r .version package.json)"
          srv="$(jq -r .version server.json)"
          srv_pkg="$(jq -r '.packages[0].version' server.json)"
          echo "tag=$tag package.json=$pkg server.json=$srv server.json packages[0]=$srv_pkg"
          if [ "$tag" != "$pkg" ] || [ "$tag" != "$srv" ] || [ "$tag" != "$srv_pkg" ]; then
            echo "::error::Version mismatch: bump package.json and both versions in server.json to $tag"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run typecheck && npm test && npm run build
      - run: npm publish --provenance --access public

      # ── MCP Registry ────────────────────────────────────────────────────
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"

          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Log in to the MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json to the MCP Registry
        run: ./mcp-publisher publish
